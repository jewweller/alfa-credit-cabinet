# Миграции БД (план, раздел 6). URL берётся из DATABASE_URL в alembic/env.py.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Разделитель путей — как в ОС, а не пробелы: в пути к проекту может быть пробел.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
