[project]
name = "alfa-credit-backend"
version = "0.1.0"
description = "Backend умного кредитного кабинета предпринимателя (хакатон Альфа-Банка)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.156.8",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
