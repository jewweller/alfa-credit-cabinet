server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Имя api разрешаем при запросе, а не при старте: фронт поднимается, даже если api ещё нет
    # (в режиме моков он фронту и не нужен). 127.0.0.11 — DNS Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;
    }

    # Сервис-воркер MSW не кешируем — иначе после пересборки браузер держит старые моки.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
    }

    # Ассеты с хешем в имени — надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: любой путь (/bank, /applications/…) отдаёт index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
