[project]
name = "alfa-credit-synth"
version = "0.1.0"
description = "Reproducible credit recommendation simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "scipy==1.15.3",
  "Faker==37.3.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "xgboost==3.0.2",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["synth/tests"]
pythonpath = [".."]
addopts = "-ra"
markers = ["distribution: statistical checks on a larger deterministic sample"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
