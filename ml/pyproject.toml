[project]
name = "alfa-feed-ranking"
version = "0.1.0"
description = "Synthetic feed ranking: logistic baseline and XGBoost LambdaMART"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=3.0,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
