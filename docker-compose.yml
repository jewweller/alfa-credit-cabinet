# Запуск: cp .env.example .env && docker compose up --build   (план, раздел 9)
# Сейчас: db + api (миграции и демо-данные при старте) + frontend (http://localhost:8080).
# mocks и worker — отдельные этапы.
name: alfa-credit-cabinet

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?задайте в .env (cp .env.example .env)}
      POSTGRES_USER: ${POSTGRES_USER:?задайте в .env (cp .env.example .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в .env (cp .env.example .env)}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Порт 5432 наружу не публикуется: БД доступна только внутри сети compose (план, раздел 9).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      # Пакет ml (ранжирование ленты) копируется в образ рядом с app — см. backend/Dockerfile.
      additional_contexts:
        ml: ./ml
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?задайте в .env (cp .env.example .env)}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_DIR: /seed
      # Ответы ЕГРЮЛ/ЕГРИП/ФНС/БКИ, пока нет сервиса mocks (черновик, mocks/fixtures/README.md).
      FIXTURES_DIR: /fixtures
      UPLOADS_DIR: /uploads
      # Сброс демо-данных администратором (POST /admin/demo/reset).
      DEMO_MODE: ${DEMO_MODE:-true}
      # Порядок новостей в ленте моделью ML (docs/ml-ranking.md); при сбое — правила.
      ML_RANKING_ENABLED: ${ML_RANKING_ENABLED:-false}
    volumes:
      - ./seed:/seed:ro
      - ./mocks/fixtures:/fixtures:ro
      - uploads:/uploads             # файлы клиентов (план, раздел 9)
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Режим данных: mocks — всё на моках в браузере (весь путь клиента и банка);
        # mixed — реализованное на бэке идёт в api, остальное — моки; real — всё в api.
        # По умолчанию mixed: на моках остаётся только то, чего ещё нет на бэке (лента).
        VITE_API_MODE: ${VITE_API_MODE:-mixed}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  uploads:
