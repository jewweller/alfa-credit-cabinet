name: ML synthetic data
on:
  pull_request:
    paths: ['ml/**', 'docs/plan.md', 'frontend/src/mocks/**', 'backend/app/scoring/**', 'backend/app/decision/**', '.github/workflows/ml-synth.yml']
  push:
    branches: [main, feat/ml-synth]
    paths: ['ml/**', '.github/workflows/ml-synth.yml']
permissions:
  contents: read
jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project ml --frozen
      - run: uv run --project ml ruff check ml
      - run: uv run --project ml ruff format --check ml
      - run: uv run --project ml python -m pytest -c ml/pyproject.toml ml/synth/tests
